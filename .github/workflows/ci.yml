name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: app
      - run: npm run lint --if-present
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run test:contract
        working-directory: app
